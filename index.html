<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página inicial com links para os projetos de programação front-end."
    />
    <title>Projetos | Programação Front-end</title>
    <style>
      @font-face {
        font-family: "Poppins";
        src: url("tecboard/fonts/Poppins-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Roboto";
        src: url("tecboard/fonts/Roboto-Bold.ttf") format("truetype");
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        font-family: "Roboto", Arial, sans-serif;
        background: #0e1014;
        color: #fff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        background:
          radial-gradient(ellipse at 50% 0, rgb(151 71 255 / 14%), transparent 48%),
          #0e1014;
      }

      main {
        width: min(100%, 960px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #b98aff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        font-family: "Poppins", "Roboto", sans-serif;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4rem);
        line-height: 1.1;
      }

      h1 span {
        color: #9747ff;
      }

      .intro {
        max-width: 620px;
        margin: 18px 0 40px;
        color: #c5c6ce;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .projects-heading {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 18px;
      }

      .projects-heading h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .project-count {
        padding: 4px 10px;
        border: 1px solid #38313f;
        border-radius: 999px;
        color: #c5c6ce;
        font-size: 0.8rem;
      }

      .project-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .project-card a {
        display: flex;
        min-height: 150px;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        border: 1px solid #302b38;
        border-radius: 18px;
        background: linear-gradient(145deg, #1a1b22, #14151a);
        color: inherit;
        text-decoration: none;
        transition: border-color 180ms ease, transform 180ms ease, background 180ms ease;
      }

      .project-card a:hover {
        transform: translateY(-3px);
        border-color: #9747ff;
        background: #1c1824;
      }

      .project-card a:focus-visible {
        outline: 3px solid #b98aff;
        outline-offset: 4px;
      }

      .project-name {
        margin: 0 0 8px;
        font-family: "Poppins", "Roboto", sans-serif;
        font-size: 1.35rem;
      }

      .project-description {
        margin: 0;
        color: #c5c6ce;
        line-height: 1.5;
      }

      .project-link {
        align-self: flex-start;
        margin-top: 20px;
        color: #b98aff;
        font-weight: 700;
      }

      .project-link span {
        display: inline-block;
        transition: transform 180ms ease;
      }

      .project-card a:hover .project-link span {
        transform: translateX(4px);
      }

      footer {
        margin-top: 48px;
        border-top: 1px solid #292a31;
        padding-top: 18px;
        color: #8f9099;
        font-size: 0.9rem;
      }

      @media (max-width: 520px) {
        body {
          padding: 36px 20px;
        }

        .intro {
          margin-bottom: 32px;
          font-size: 1rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Repositório · TADS 2026</p>
        <h1>Projetos <span>Front-end</span></h1>
        <p class="intro">
          Acesse os projetos desenvolvidos nos laboratórios da disciplina de
          Programação Front-end.
        </p>
      </header>

      <section aria-labelledby="projects-title">
        <div class="projects-heading">
          <h2 id="projects-title">Projetos disponíveis</h2>
          <span class="project-count" aria-label="1 projeto">1 projeto</span>
        </div>
        <ul class="project-list">
          <li class="project-card">
            <a href="tecboard/index.html">
              <div>
                <h3 class="project-name">Tecboard</h3>
                <p class="project-description">
                  Página de monitoramento com alertas inteligentes para aplicações.
                </p>
              </div>
              <span class="project-link">Acessar projeto <span aria-hidden="true">→</span></span>
            </a>
          </li>
          <!-- Para adicionar um projeto futuro, duplique um item da lista e atualize o href, o título e a descrição. -->
        </ul>
      </section>
    </main>
  </body>
</html>
